<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: {{width}}px;
    height: {{height}}px;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .title-container {
    text-align: center;
    position: relative;
  }

  .main-title {
    font-family: 'Georgia', 'Times New Roman', serif;
    font-size: 120px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 18px;
    text-transform: uppercase;
    text-shadow:
      0 0 40px rgba(100, 180, 255, 0.8),
      0 0 80px rgba(100, 180, 255, 0.4),
      0 4px 12px rgba(0, 0, 0, 0.6);
    animation: titleIn 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    opacity: 0;
  }

  .subtitle {
    font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
    font-size: 36px;
    font-weight: 300;
    color: rgba(255, 255, 255, 0.9);
    letter-spacing: 12px;
    text-transform: uppercase;
    margin-top: 20px;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    animation: subtitleIn 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
    opacity: 0;
  }

  .line {
    width: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);
    margin: 24px auto 0;
    animation: lineExpand 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
  }

  /* Fade everything out near the end */
  .title-container {
    animation: fadeOut 1s ease-in 3.5s forwards;
  }

  @keyframes titleIn {
    0% {
      opacity: 0;
      transform: translateY(30px) scale(0.95);
      filter: blur(8px);
    }
    100% {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0);
    }
  }

  @keyframes subtitleIn {
    0% {
      opacity: 0;
      transform: translateY(15px);
      letter-spacing: 30px;
    }
    100% {
      opacity: 1;
      transform: translateY(0);
      letter-spacing: 12px;
    }
  }

  @keyframes lineExpand {
    0% { width: 0; }
    100% { width: 500px; }
  }

  @keyframes fadeOut {
    0% { opacity: 1; }
    100% { opacity: 0; }
  }
</style>
</head>
<body>
  <div class="title-container">
    <div class="main-title">Troms&oslash;</div>
    <div class="line"></div>
    <div class="subtitle">Trip</div>
  </div>
</body>
</html>
