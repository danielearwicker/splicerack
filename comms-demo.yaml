output:
  width: 1920
  height: 1080
  fps: 30
  background: "#1a1a2e"

audio-templates:
  narrator:
    type: tts
    voice: en-GB-RyanNeural
    volume: 0.9

templates:
  heading:
    type: "caption"
    duration: 3
    style:
      font-size: 64
      color: "#ffffff"
      background: "#1a1a2e"
      align: "center"
      valign: "middle"
    fade-in: 0.5
    fade-out: 0.5

  section title:
    type: "caption"
    duration: 3
    style:
      font-size: 42
      color: "#8ab4f8"
      background: "#1a1a2e"
      align: "center"
      valign: "middle"
    fade-in: 0.3
    fade-out: 1

  comms clip:
    type: "clip"
    source: "Communication with Suppliers.mp4"
    fade-in: 0.3
    fade-out: 0.3

timeline:
  - type: heading
    text: "Comms Explainer Demo Thingy"

  - type: stack
    background: "#1a1a2e"
    layers:
      - type: caption
        text: "peas"
        duration: 3
        style:
          font-size: 48
          color: "#ffffff"
          background: "#1a1a2e"
          align: "left"
          valign: "middle"
        fade-in: 0.5
        fade-out: 0.5
        opacity: 0.5
        delay: 0
      - type: caption
        text: "chips"
        duration: 3
        style:
          font-size: 48
          color: "#ffffff"
          background: "#1a1a2e"
          align: "right"
          valign: "middle"
        fade-in: 0.5
        fade-out: 0.5
        opacity: 0.5
        delay: 0

  - type: section title
    text: "Adding a thingy from whatever"
    style:
      align: "right"
      color: "#e7ad0d"

  - type: comms clip
    clip: "product"
    speed: 1
    fade-in: 0.3
    audio:
      - template: narrator
        text: "Here we can see how to add a new product from the supplier list. Simply search for the item and click to add it."

  - type: section title
    text: "Amanda - all emails"

  - type: comms clip
    clip: "diagram"
    audio:
      - type: source
        volume: 0.3
      - template: narrator
        text: "This diagram shows how Amanda's email communications are routed. All incoming messages are captured and logged automatically."
        delay: 1

  - type: section title
    text: "Henry - selected emails"

  - type: comms clip
    clip: "email"

  - type: heading
    text: "Thanks for watching!"
    style:
      color: "#e94560"
      font-size: 48
