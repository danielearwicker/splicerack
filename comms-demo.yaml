output:
  width: 1920
  height: 1080
  fps: 30
  background: "#1a1a2e"

templates:
  heading:
    type: caption
    duration: 3
    style:
      font-size: 64
      color: "#ffffff"
      background: "#1a1a2e"
      align: "center"
      valign: "middle"
    fade-in: 0.5
    fade-out: 0.5

  section title:
    type: caption
    duration: 3
    style:
      font-size: 42
      color: "#8ab4f8"
      background: "#1a1a2e"
      align: "center"
      valign: "middle"
    fade-in: 0.3
    fade-out: 1

  comms clip:
    type: clip
    source: comms-2026-03-01-clip-2.mp4
    fade-in: 0.3
    fade-out: 0.3

timeline:
  - type: heading
    text: "Comms Explainer Demo Thingy"

  - type: section title
    text: "Adding a thingy from suppliers"

  - type: comms clip
    clip: add contact from suppiers

  - type: section title
    text: "Amanda - all emails"

  - type: comms clip
    clip: amanda all emails

  - type: section title
    text: "Henry - selected emails"

  - type: comms clip
    clip: henry some emails

  - type: section title
    text: "Enrolling"

  - type: comms clip
    clip: enrol

  - type: heading
    text: "Thanks for watching!"
    style:
      color: "#e94560"
      font-size: 48
