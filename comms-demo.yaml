output:
  width: 1920
  height: 1080
  fps: 30
  background: "#1a1a2e"

timeline:
  - type: heading
    text: "Comms Explainer Demo Thingy"

  - type: stack
    background: "#1a1a2e"
    layers:
      - type: heading
        text: "peas"
        style:
          font-size: 48
          align: "left"
        opacity: 0.5
      - type: heading
        text: "chips"
        style:
          font-size: 48
          align: "right"
        opacity: 0.5

  - type: section title
    text: "How information flows"

  - type: comms clip
    clip: "flow"
    keyframes:
      - time: 0
        scale: 1
        x: 0.55
        y: 0.5
      - time: 8
        scale: 2.2
        x: 0.62
        y: 0.48
        ease: ease-in-out
      - time: 11
        scale: 2.2
        x: 0.63
        y: 0.28
        ease: ease-in-out
      - time: 15
        scale: 2
        x: 0.55
        y: 0.58
        ease: ease-in-out
      - time: 19
        scale: 2
        x: 0.55
        y: 0.78
        ease: ease-in-out
      - time: 27
        scale: 1.8
        x: 0.52
        y: 0.78
        ease: ease-in-out
      - time: 31
        scale: 1.6
        x: 0.58
        y: 0.72
        ease: ease-in-out
      - time: 36
        scale: 1.8
        x: 0.65
        y: 0.62
        ease: ease-in-out
      - time: 40
        scale: 2
        x: 0.62
        y: 0.48
        ease: ease-in-out
      - time: 43
        scale: 2
        x: 0.62
        y: 0.42
        ease: ease-in-out
      - time: 46
        scale: 1
        x: 0.55
        y: 0.5
        ease: ease-in-out

  - type: section title
    text: "Adding a thingy from whatever"
    style:
      align: "right"
      color: "#e7ad0d"

  - type: comms clip
    clip: "product"
    speed: 1
    fade-in: 0.3
    audio:
      - type: narrator
        text: "Here we can see how to add a new product from the supplier list. Simply search for the item and click to add it."

  - type: section title
    text: "Amanda - all emails"

  - type: comms clip
    clip: "diagram"
    audio:
      - type: source
        volume: 0.3
      - type: narrator
        text: "This diagram shows how Amanda's email communications are routed. All incoming messages are captured and logged automatically."
        delay: 1

  - type: section title
    text: "Henry - selected emails"

  - type: comms clip
    clip: "email"

  - type: heading
    text: "Thanks for watching!"
    style:
      color: "#e94560"
      font-size: 48
