output:
  width: 1920
  height: 1080
  fps: 30
  background: "#1a1a2e"

timeline:
  - type: logo intro

  - type: heading
    text: "Define videos in YAML. Render with FFmpeg."
    style:
      font-size: 42

  - type: section title
    text: "The Timeline"

  - type: comms clip
    source: "ScreenReclauding.mp4"
    clip: "timeline-overview"
    speed: 1
    audio:
      - type: narrator
        text: "SpliceRack lets you compose videos declaratively. Your project is a YAML file with a timeline of segments."

  - type: section title
    text: "Media Library"

  - type: comms clip
    source: "ScreenReclauding.mp4"
    clip: "library-clips"
    audio:
      - type: narrator
        text: "Upload your videos to the library. Mark named clips with in and out points."

  - type: section title
    text: "Reusable Templates"

  - type: comms clip
    source: "ScreenReclauding.mp4"
    clip: "templates-list"
    audio:
      - type: narrator
        text: "Define templates once, reuse them everywhere. Change a template and every segment that uses it updates."

  - type: comms clip
    source: "ScreenReclauding.mp4"
    clip: "template-heading"

  - type: section title
    text: "Visual Property Editor"

  - type: comms clip
    source: "ScreenReclauding.mp4"
    clip: "editor-heading"
    audio:
      - type: narrator
        text: "Click any segment to edit its properties. Templates show inherited values you can override."

  - type: section title
    text: "Stack Compositing"

  - type: comms clip
    source: "ScreenReclauding.mp4"
    clip: "editor-stack"
    audio:
      - type: narrator
        text: "Stack multiple layers with opacity and delay. Each layer can be any segment type or template."

  - type: section title
    text: "Audio & AI Narration"

  - type: comms clip
    source: "ScreenReclauding.mp4"
    clip: "editor-clip-audio"
    audio:
      - type: narrator
        text: "Add audio layers to any segment. Text to speech generates narration from Azure, cached for instant re-renders."

  - type: section title
    text: "Keyframe Zoom & Pan"

  - type: comms clip
    source: "ScreenReclauding.mp4"
    clip: "editor-keyframes"
    audio:
      - type: narrator
        text: "Animate zoom and pan with keyframes. Perfect for screen recordings where you want to focus on specific elements."

  - type: section title
    text: "Smart Caching"

  - type: comms clip
    source: "ScreenReclauding.mp4"
    clip: "logs-cached"
    audio:
      - type: narrator
        text: "Every segment is cached by its settings. Change one thing, only that segment re-renders. The rest is instant."

  - type: heading
    text: "SpliceRack"
    style:
      font-size: 80
      color: "#e94560"

  - type: logo outro
